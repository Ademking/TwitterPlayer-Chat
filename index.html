<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>TweetChat</title>

  <!-- SEO -->
  <meta
    name="description"
    content="Join TweetChat and chat with everyone in the same room"
  >

  <link
    rel="canonical"
    href="https://ademking.github.io/TwitterPlayer-Chat/"
  >

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TweetChat">
  <meta property="og:title" content="TweetChat — Join the Chat">
  <meta
    property="og:description"
    content="Join TweetChat and chat with everyone in the same room. No account required."
  >
  <meta
    property="og:url"
    content="https://ademking.github.io/TwitterPlayer-Chat/"
  >
  <meta
    property="og:image"
    content="https://ademking.github.io/TwitterPlayer-Chat/og.png"
  >

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TweetChat — Join the Chat">
  <meta
    name="twitter:description"
    content="Join TweetChat and chat with everyone in the same room. No account required."
  >
  <meta
    name="twitter:image"
    content="https://ademking.github.io/TwitterPlayer-Chat/og.png"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #chat {
      display: block;
      width: 100%;
      height: 400px;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe
    id="chat"
    title="TweetChat"
    allow="clipboard-write"
  ></iframe>

  <script>
    const colors = [
      "Red",
      "Blue",
      "Green",
      "Yellow",
      "Orange",
      "Purple",
      "Pink",
      "Black",
      "White",
      "Silver",
      "Golden",
      "Brown",
      "Cyan",
      "Violet"
    ];

    const animals = [
      "Tiger",
      "Panda",
      "Fox",
      "Wolf",
      "Eagle",
      "Lion",
      "Bear",
      "Rabbit",
      "Dragon",
      "Shark",
      "Dolphin",
      "Koala",
      "Penguin",
      "Monkey",
      "Owl"
    ];

    function randomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    // Generate: Color + Animal + 4 digits
    const username =
      randomItem(colors) +
      randomItem(animals) +
      Math.floor(1000 + Math.random() * 9000);

    const cssUrl =
      "https://cdn.statically.io/gist/Ademking/0d759055f68b8796cbaa33a50613cda5/raw/381943b68a7ddf78b980233d1c290ef650dbf689/light.css";

    const chatUrl =
      "https://embed.tlk.io/tweetchat" +
      "?custom_css_path=" + encodeURIComponent(cssUrl) +
      "&nickname=" + encodeURIComponent(username);

    document.getElementById("chat").src = chatUrl;
  </script>

</body>
</html>
